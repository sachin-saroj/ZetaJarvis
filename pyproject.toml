[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zetajarvis"
version = "1.0.0.0"
description = "Enterprise Digital Worker Node & Desktop Domination Layer for Windows"
authors = [{ name = "Sachin Saroj" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai==3.10.0",
    "tiktoken==0.14.0",
    "sounddevice==0.5.6",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "pyttsx3==2.99",
    "psutil==7.2.2",
    "pynput==1.8.2",
    "uiautomation==2.0.29",
    "pywin32==312",
    "cryptography==50.0.1",
    "requests==2.34.2",
]

[project.scripts]
zetajarvis = "zetajarvis.main:main"

[tool.setuptools.packages.find]
where = ["src"]
